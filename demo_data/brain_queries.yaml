# Questions an agent might ask the brain, with the sources that answer them.
# sources: demo email id (e04), vault path (Meetings/...), or PDF filename. facts: expected structured facts.
# Used by `omnitrix brain bench` to measure accuracy, speed and how much of the brain each question reads.
