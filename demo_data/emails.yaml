# Ravi's email for the demo week. All fictional; every address uses the reserved .example domain.
#
# stage: inbox  -> already in the mailbox when the demo starts (Thu 8 Oct, 8:55 AM)
#        live   -> sent into Mailpit during the demo at `at` (omnitrix demo send <id> / demo play)
# thread: emails with the same thread key form one conversation (In-Reply-To / References are set)
# scenario: which planted scenario (see scenarios.md) the email belongs to
# expect: what the agents should find - used by scenario tests, never shown to the model
me: &me {name: Ravi Kumar, email: ravi@suryodayafoods.example}

