[project]
name = "omnitrix"
version = "0.1.0"
description = "Omnitrix: a sovereign second brain - a team of local AI agents that works as your personal secretary"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "pyyaml>=6",
    "pypdf>=6.19.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
omnitrix = "omnitrix.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
demo = ["reportlab>=4"]   # only for demo_data/build.py

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs the Postgres service (docker compose up)",
    "ollama: needs a running Ollama with the configured models",
    "graphify: needs the graphify tool (uv tool install graphifyy)",
]
