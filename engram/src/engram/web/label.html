<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>engram · label check</title>
<style>
:root {
  --bg: #07080B; --solid: #0E1015; --ink: #ECE8DF; --muted: #9A9689; --line: #232733;   /* docs/design.md §2 */
  --accent: #ECE8DF; --accent-ink: #07080B; --soft: #151821;
  --ok: #6FCF97; --ok-bg: #10261C; --bad: #FF7A6B; --bad-bg: #33181A;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
main { max-width: 860px; margin: 0 auto; padding: 20px 16px 120px; }
h1 { font-size: 16px; margin: 0 0 4px; } .muted { color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
nav button { background: var(--solid); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
             padding: 8px 12px; cursor: pointer; font: inherit; text-align: left; }
nav button.on { background: var(--soft); border-color: var(--accent); }
nav small { display: block; color: var(--muted); font-family: var(--mono); font-size: 11px; }
.q { background: var(--soft); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; }
pre { white-space: pre-wrap; word-break: break-word; background: var(--solid); border: 1px solid var(--line);
      border-radius: 8px; padding: 14px; font-family: var(--mono); font-size: 12.5px; max-height: 58vh; overflow: auto; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--solid); border-top: 1px solid var(--line);
       display: flex; gap: 10px; justify-content: center; padding: 14px 16px; }
.bar button { font: inherit; font-weight: 600; border-radius: 8px; padding: 12px 22px; cursor: pointer; border: 1px solid; }
.yes { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.no { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.skip { background: transparent; color: var(--muted); border-color: var(--line); }
kbd { font-family: var(--mono); font-size: 11px; opacity: .7; margin-left: 6px; }
</style>
</head>
<body>
<main>
  <h1>Label check for adapter v2</h1>
  <div class="muted">Answer the question for the material, as the owner would. The derived label is hidden so it
    can't sway you; skip anything unclear (it stays out of training). Keys: <b>y</b> yes, <b>n</b> no, <b>s</b> skip.</div>
  <nav id="tabs"></nav>
  <div id="card"></div>
</main>
<div class="bar">
  <button class="yes" data-v="yes">Yes<kbd>y</kbd></button>
  <button class="no" data-v="no">No<kbd>n</kbd></button>
  <button class="skip" data-v="skip">Skip<kbd>s</kbd></button>
</div>
<script src="/label.js"></script>
</body>
</html>
