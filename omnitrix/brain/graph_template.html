<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Omnitrix Brain Map</title>
<style>
:root {
  --bg: #f6f6f3; --surface: #ffffff; --surface-2: #f0f1ee; --ink: #1b1f24; --muted: #667080; --line: #dcdfe3;
  --edge: rgba(92, 104, 120, .22); --edge-strong: rgba(40, 48, 60, .75);
  --person: #0f766e; --organization: #6d28d9; --project: #c2630a; --email: #2563eb; --note: #15803d;
  --pdf: #be185d; --attachment: #db2777; --decision: #dc2626;
  --ask: #f59e0b; --hit: #111827; --focus: #2563eb;
  --c0: #2563eb; --c1: #c2410c; --c2: #047857; --c3: #be185d; --c4: #6d28d9; --c5: #0e7490; --c6: #a16207;
  --c7: #4d7c0f; --unlinked: #9ca3af;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111417; --surface: #181c20; --surface-2: #20252b; --ink: #e8eaed; --muted: #9aa3ad; --line: #2c3238;
    --edge: rgba(170, 180, 195, .16); --edge-strong: rgba(235, 238, 242, .8);
    --person: #2dd4bf; --organization: #a78bfa; --project: #fbbf24; --email: #60a5fa; --note: #4ade80;
    --pdf: #f472b6; --attachment: #f9a8d4; --decision: #f87171; --ask: #fbbf24; --hit: #ffffff; --focus: #60a5fa;
    --c0: #60a5fa; --c1: #fb923c; --c2: #34d399; --c3: #f472b6; --c4: #a78bfa; --c5: #22d3ee; --c6: #facc15;
    --c7: #a3e635; --unlinked: #6b7280;
  }
}
:root[data-theme="dark"] {
  --bg: #111417; --surface: #181c20; --surface-2: #20252b; --ink: #e8eaed; --muted: #9aa3ad; --line: #2c3238;
  --edge: rgba(170, 180, 195, .16); --edge-strong: rgba(235, 238, 242, .8);
  --person: #2dd4bf; --organization: #a78bfa; --project: #fbbf24; --email: #60a5fa; --note: #4ade80;
  --pdf: #f472b6; --attachment: #f9a8d4; --decision: #f87171; --ask: #fbbf24; --hit: #ffffff; --focus: #60a5fa;
  --c0: #60a5fa; --c1: #fb923c; --c2: #34d399; --c3: #f472b6; --c4: #a78bfa; --c5: #22d3ee; --c6: #facc15;
  --c7: #a3e635; --unlinked: #6b7280;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
body { display: flex; flex-direction: column; font-size: 14px; }
header { display: flex; align-items: center; gap: 20px; padding: 12px 20px; border-bottom: 1px solid var(--line);
  background: var(--surface); flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.chip { background: var(--surface-2); border-radius: 999px; padding: 5px 11px; font-size: 12px; color: var(--muted); }
.chip b { color: var(--ink); font-variant-numeric: tabular-nums; }
.local { color: var(--note); font-weight: 600; }
main { flex: 1; display: grid; grid-template-columns: 330px 1fr 300px; min-height: 0; }
aside { background: var(--surface); overflow-y: auto; padding: 16px; }
aside.left { border-right: 1px solid var(--line); }
aside.right { border-left: 1px solid var(--line); }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 10px; }
.hint { color: var(--muted); font-size: 12.5px; line-height: 1.45; margin: 0 0 12px; }
.q { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; font: inherit;
  font-size: 13px; line-height: 1.35; }
.q:hover { border-color: var(--focus); }
.q[aria-pressed="true"] { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 25%, transparent); }
.q .agent { display: inline-block; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.steps { list-style: none; padding: 0; margin: 14px 0 0; }
.steps > li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line);
  opacity: .35; transition: opacity .3s; }
.steps > li.on { opacity: 1; }
.steps .n { width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center;
  font-size: 11px; font-weight: 700; }
.steps > li.on .n { background: var(--ask); color: #111; }
.big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; margin: 5px 0 2px; }
.bar i { display: block; height: 100%; background: var(--focus); border-radius: 4px; transition: width .6s; }
.bar.rag i { background: var(--muted); }
.cmp { font-size: 12px; color: var(--muted); margin-top: 10px; }
.cmp div { margin-bottom: 8px; }
.ret { margin: 8px 0 0; padding: 0; list-style: none; }
.ret li { font-size: 12.5px; padding: 6px 0; border-top: 1px dashed var(--line); cursor: pointer; }
.ret li b { display: inline-block; min-width: 20px; }
.ret .why { color: var(--muted); font-size: 11px; }
.asked { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; }
.fact { font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 6px 8px; margin-top: 6px; }
.stage { position: relative; min-width: 0; min-height: 0; }
svg { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
svg.panning { cursor: grabbing; }
.tools { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; }
.tools input, .tools button { font: inherit; font-size: 12.5px; border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); border-radius: 7px; padding: 6px 10px; }
.tools button { cursor: pointer; }
.legend { position: absolute; left: 12px; bottom: 12px; background: color-mix(in srgb, var(--surface) 92%, transparent);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; display: grid;
  grid-template-columns: repeat(2, auto); gap: 4px 14px; }
.legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.sw { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.sw.sq { border-radius: 2px; }
.sw.dm { border-radius: 1px; transform: rotate(45deg) scale(.85); }
.edge { stroke: var(--edge); stroke-width: 1; }
.edge.relation { stroke-width: 1.4; }
.edge.reply_to, .edge.attachment_of { stroke-dasharray: 3 3; }
.node { stroke: var(--surface); stroke-width: 1.5; cursor: pointer; transition: opacity .25s; }
.node.self { stroke: var(--ink); stroke-width: 2.5; }
.lbl { font-size: 10.5px; fill: var(--ink); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px;
  stroke-linejoin: round; transition: opacity .25s; }
.lbl.doc { font-size: 9.5px; fill: var(--muted); opacity: 0; }
.showdocs .lbl.doc, .lbl.doc.show { opacity: 1; }
.tracing .node, .tracing .lbl { opacity: .12; }
.tracing .edge { opacity: .25; }
.tracing .scope { opacity: .55; }
.tracing .lbl.scope { opacity: .8; }
.tracing .ask, .tracing .hit, .tracing .factn { opacity: 1; }
.tracing .lbl.ask, .tracing .lbl.hit, .tracing .lbl.factn { opacity: 1; font-weight: 700; }
.node.ask { stroke: var(--ask); stroke-width: 4; }
.node.hit { stroke: var(--hit); stroke-width: 3; }
.node.factn { stroke: var(--ask); stroke-width: 3; stroke-dasharray: 2 2; }
.edge.lit { stroke: var(--edge-strong); stroke-width: 1.6; opacity: 1 !important; }
.badge { font-size: 10px; font-weight: 800; fill: #111; pointer-events: none; }
.badge-bg { fill: var(--ask); }
.selected { stroke: var(--focus) !important; stroke-width: 4 !important; opacity: 1 !important; }
.d-title { font-weight: 700; font-size: 15px; margin: 0 0 4px; line-height: 1.3; }
.d-meta { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
.d-snip { font-size: 12.5px; line-height: 1.45; background: var(--surface-2); border-radius: 8px; padding: 8px 10px;
  white-space: pre-wrap; }
.d-links { list-style: none; padding: 0; margin: 10px 0 0; font-size: 12.5px; }
.d-links li { padding: 4px 0; cursor: pointer; }
.d-links li:hover { color: var(--focus); }
.kv { font-size: 12.5px; margin: 2px 0; }
.kv span { color: var(--muted); }
.empty { color: var(--muted); font-size: 12.5px; }
/* graphify clusters */
.tabs { display: flex; gap: 4px; margin: -4px 0 14px; border-bottom: 1px solid var(--line); }
.tabs button { font: inherit; font-size: 13px; background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--muted); padding: 6px 10px 8px; cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--focus); font-weight: 600; }
.cl { display: grid; grid-template-columns: 12px 1fr; gap: 2px 9px; width: 100%; text-align: left; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer;
  font: inherit; font-size: 13px; }
.cl:hover { border-color: var(--focus); }
.cl[aria-pressed="true"] { border-color: var(--focus); box-shadow: 0 0 0 2px color-mix(in srgb, var(--focus) 25%, transparent); }
.cl .sw { margin-top: 4px; }
.cl .meta, .cl .who { grid-column: 2; font-size: 11.5px; color: var(--muted); }
.cl .meta { font-variant-numeric: tabular-nums; }
.hubs { margin: 0 0 14px; padding-left: 22px; font-size: 13px; }
.hubs li { padding: 3px 0; cursor: pointer; }
.hubs li:hover { color: var(--focus); }
.hubs span { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.small { font-size: 11.5px; }
.hull { opacity: .1; stroke-width: 46; stroke-linejoin: round; transition: opacity .25s; pointer-events: none; }
.clabel { font-size: calc(13px * var(--k, 1)); font-weight: 700; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 4px;
  stroke-linejoin: round; transition: opacity .25s; cursor: pointer; }
.ulabel { font-size: calc(11px * var(--k, 1)); fill: var(--muted); font-style: italic; }
.lbl.hub { font-weight: 700; font-size: calc(10.5px * var(--k, 1)); }
.lbl.doc.pin { opacity: 1; }
.focusing .node:not(.infocus), .focusing .lbl:not(.infocus) { opacity: .1; }
.focusing .edge:not(.infocus) { opacity: .12; }
.focusing .hull:not(.infocus), .focusing .clabel:not(.infocus) { opacity: .03; }
.focusing .lbl.doc.infocus { opacity: 1; }
.focusing .edge.infocus { stroke: var(--edge-strong); }
.tracing .hull { opacity: .04; }
.tracing .clabel { opacity: .25; }
@media (max-width: 1100px) { main { grid-template-columns: 280px 1fr; } aside.right { display: none; } }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 60vh auto; }
  aside.left { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  .stage { order: 1; height: 60vh; }
  .tools { left: 8px; right: 8px; top: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .tools input { flex: 1 1 100%; }
  .tools button { font-size: 12px; padding: 5px 8px; }
  .legend { left: 6px; right: 6px; bottom: 6px; grid-template-columns: repeat(3, auto); gap: 2px 8px; font-size: 10.5px;
    padding: 6px 8px; }
}
</style>
</head>
<body>
<header>
  <div class="brand">Omnitrix · Brain Map<small>Ravi Kumar's second brain · <span class="local">100% local</span> · fictional demo data</small></div>
  <div class="chips" id="chips"></div>
</header>
<main>
  <aside class="left">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-clusters" aria-selected="true" aria-controls="panel-clusters">Clusters</button>
      <button type="button" role="tab" id="tab-questions" aria-selected="false" aria-controls="panel-questions">Questions</button>
    </div>
    <section id="panel-clusters" role="tabpanel" aria-labelledby="tab-clusters"></section>
    <section id="panel-questions" role="tabpanel" aria-labelledby="tab-questions" hidden>
      <h2>Ask the brain</h2>
      <p class="hint">Each question below was asked by an agent. Pick one to see which part of the brain it touched -
        the brain never reads everything.</p>
      <div id="trace"></div>
      <div id="queries"></div>
    </section>
  </aside>
  <div class="stage">
    <svg id="svg" role="img" aria-label="Graph of how Ravi's documents, people, organizations, projects and decisions connect"></svg>
    <div class="tools">
      <input id="find" type="search" placeholder="Find a person, project, email…" aria-label="Find node">
      <button id="mode" type="button">Colour: clusters</button>
      <button id="labels" type="button">Show document names</button>
      <button id="clear" type="button">Clear</button>
      <button id="fit" type="button">Fit</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <aside class="right" id="details"><h2>Details</h2><p class="empty">Click any dot to see what it is and what it connects to.</p></aside>
</main>
<script>
const DATA = /*__DATA__*/null;
const NS = "http://www.w3.org/2000/svg";
const GROUPS = {
  person: {label: "Person", shape: "circle"}, organization: {label: "Organization", shape: "circle"},
  project: {label: "Project", shape: "circle"}, decision: {label: "Decision", shape: "diamond"},
  email: {label: "Email", shape: "square"}, note: {label: "Obsidian note", shape: "square"},
  pdf: {label: "PDF file", shape: "square"}, attachment: {label: "Email attachment", shape: "square"},
};
const LENGTH = {relation: 95, mention: 70, reply_to: 38, attachment_of: 28, decided_in: 34, decided_by: 70};
const PALETTE = 8;              // --c0 .. --c7
const HUBS_LABELLED = 8;        // the best-connected nodes always show their names
const isDoc = n => ["email", "note", "pdf", "attachment"].includes(n.group);
const fmt = n => Number(n).toLocaleString();
const pct = x => (x * 100 < 1 && x > 0) ? (x * 100).toFixed(1) + "%" : Math.round(x * 100) + "%";

// seeded random numbers, so the map looks the same on every load
let seed = 20261008;
function rand() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

// ------------------------------------------------------------------ data
const GFY = DATA.graphify || {available: false, reason: "not run"};
const clusters = GFY.available ? GFY.clusters.map(c => ({...c})) : [];
const nodes = DATA.nodes.map(n => ({...n}));
const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
const edges = DATA.edges.filter(e => byId[e.s] && byId[e.t]).map(e => ({...e, a: byId[e.s], b: byId[e.t]}));
const adj = {};
for (const e of edges) { (adj[e.s] ||= []).push(e); (adj[e.t] ||= []).push(e); }
const hubRank = Object.fromEntries((GFY.hubs || []).map((h, i) => [h.id, i + 1]));
for (const n of nodes) {
  n.degree = (adj[n.id] || []).length;
  n.cluster = GFY.available && GFY.node_cluster[n.id] !== undefined ? GFY.node_cluster[n.id] : null;
  n.unlinked = GFY.available && n.cluster === null;
  n.hub = hubRank[n.id] || 0;
}
for (const c of clusters) c.nodes = c.members.map(id => byId[id]).filter(Boolean);
for (const e of edges) e.inside = e.a.cluster !== null && e.a.cluster === e.b.cluster;
let colourBy = GFY.available ? "cluster" : "type";

function radius(n) {
  if (n.group === "decision") return 8;
  if (isDoc(n)) return 4.5 + Math.min(n.chunks || 1, 3) + (n.hub ? 2 : 0);
  return Math.min(17, 6 + Math.sqrt(n.degree) * 2.3);      // bigger = more connected (graphify's hub idea)
}
const clusterColor = c => `var(--c${c % PALETTE})`;
function color(n) {
  if (colourBy === "cluster") return n.cluster !== null ? clusterColor(n.cluster) : "var(--unlinked)";
  return `var(--${n.group})`;
}

// ------------------------------------------------------------------ layout (small force simulation)
function placeClusters() {
  // your own company's cluster in the middle, the other clusters around it
  const centre = clusters.find(c => c.nodes.some(n => n.self)) || clusters[0];
  const ring = clusters.filter(c => c !== centre);
  const R = 230 + 46 * ring.length;
  if (centre) { centre.cx = 0; centre.cy = 0; }
  ring.forEach((c, i) => {
    const a = (i / ring.length) * Math.PI * 2 - Math.PI / 2;
    c.cx = Math.cos(a) * R; c.cy = Math.sin(a) * R * 0.8;
  });
}
function seedPositions() {
  if (GFY.available) {
    for (const n of nodes) {
      const c = n.cluster !== null ? clusters[n.cluster] : null, a = rand() * Math.PI * 2, r = 15 + rand() * 55;
      n.x = (c ? c.cx : 0) + Math.cos(a) * r; n.y = (c ? c.cy : 0) + Math.sin(a) * r;
    }
    return;
  }
  const ents = nodes.filter(n => !isDoc(n) && n.group !== "decision");
  ents.forEach((n, i) => {
    const a = (i / ents.length) * Math.PI * 2, r = n.self ? 0 : 170 + (n.group === "project" ? -60 : 40);
    n.x = Math.cos(a) * r; n.y = Math.sin(a) * r;
  });
  for (const n of nodes) {
    if (n.x !== undefined) continue;
    const anchor = (adj[n.id] || []).map(e => e.a === n ? e.b : e.a).find(m => m.x !== undefined);
    const a = rand() * Math.PI * 2;
    n.x = (anchor ? anchor.x : 0) + Math.cos(a) * 60; n.y = (anchor ? anchor.y : 0) + Math.sin(a) * 60;
  }
}
function layout() {
  placeClusters();
  seedPositions();
  const live = nodes.filter(n => !n.unlinked);
  live.forEach(n => { n.vx = 0; n.vy = 0; });
  const N = 520;
  for (let it = 0; it < N; it++) {
    const alpha = 1 - it / N;
    for (let i = 0; i < live.length; i++) {
      const p = live[i];
      for (let j = i + 1; j < live.length; j++) {
        const q = live[j];
        let dx = p.x - q.x, dy = p.y - q.y;
        let d2 = dx * dx + dy * dy;
        if (d2 < 1) { dx = rand() - .5; dy = rand() - .5; d2 = 1; }
        if (d2 > 90000) continue;
        const f = (isDoc(p) && isDoc(q) ? 520 : 1400) * alpha / d2;
        p.vx += dx * f; p.vy += dy * f; q.vx -= dx * f; q.vy -= dy * f;
      }
    }
    for (const e of edges) {
      if (e.a.unlinked || e.b.unlinked) continue;
      // links inside a cluster pull tight; links between clusters stay long and loose
      const across = GFY.available && !e.inside;
      const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const len = (LENGTH[e.kind] || 70) * (across ? 1.9 : GFY.available ? 0.85 : 1);
      const f = (d - len) * (across ? 0.012 : 0.045) * alpha / d;
      e.a.vx += dx * f; e.a.vy += dy * f; e.b.vx -= dx * f; e.b.vy -= dy * f;
    }
    for (const n of live) {
      const c = n.cluster !== null ? clusters[n.cluster] : null;
      if (c) { const k = c.cx === 0 && c.cy === 0 ? 0.03 : 0.02; n.vx += (c.cx - n.x) * k * alpha; n.vy += (c.cy - n.y) * k * alpha; }
      else { const pull = n.self ? 0.08 : 0.006; n.vx -= n.x * pull * alpha; n.vy -= n.y * pull * alpha; }
      n.vx *= 0.6; n.vy *= 0.6;
      n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy));
    }
  }
  separateClusters();
  // nodes graphify could not place in any cluster: one tidy row underneath, on the right (the legend is left)
  const loose = nodes.filter(n => n.unlinked);
  if (loose.length) {
    const xs = live.map(n => n.x), ys = live.map(n => n.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs), y0 = Math.max(...ys) + 110;
    const step = Math.max(34, Math.min(60, (maxX - minX) / 2 / loose.length));
    loose.forEach((n, i) => { n.x = maxX - (loose.length - 1 - i) * step; n.y = y0; });
    looseRow = {x: maxX, y: y0 - 24};
  }
}
// push apart clusters whose outlines would overlap (each cluster moves as one piece)
function separateClusters() {
  const GAP = 60;
  for (let it = 0; it < 80; it++) {
    for (const c of clusters) {
      c.mx = c.nodes.reduce((s, n) => s + n.x, 0) / c.nodes.length;
      c.my = c.nodes.reduce((s, n) => s + n.y, 0) / c.nodes.length;
      c.r = Math.max(...c.nodes.map(n => Math.hypot(n.x - c.mx, n.y - c.my) + radius(n)));
    }
    let moved = false;
    for (let i = 0; i < clusters.length; i++) for (let j = i + 1; j < clusters.length; j++) {
      const a = clusters[i], b = clusters[j];
      let dx = b.mx - a.mx, dy = b.my - a.my;
      const d = Math.hypot(dx, dy) || 1, overlap = a.r + b.r + GAP - d;
      if (overlap <= 0) continue;
      moved = true;
      dx /= d; dy /= d;
      const wa = b.nodes.length / (a.nodes.length + b.nodes.length), wb = 1 - wa;   // the smaller cluster moves more
      for (const n of a.nodes) { n.x -= dx * overlap * wa * 0.5; n.y -= dy * overlap * wa * 0.5; }
      for (const n of b.nodes) { n.x += dx * overlap * wb * 0.5; n.y += dy * overlap * wb * 0.5; }
      a.mx -= dx * overlap * wa * 0.5; a.my -= dy * overlap * wa * 0.5;
      b.mx += dx * overlap * wb * 0.5; b.my += dy * overlap * wb * 0.5;
    }
    if (!moved) break;
  }
}
let looseRow = null;

// ------------------------------------------------------------------ drawing
const svg = document.getElementById("svg");
const root = document.createElementNS(NS, "g");
const gHulls = document.createElementNS(NS, "g");

function el(tag, attrs, parent) {

}

function draw() {
  for (const c of clusters) {
    c.hullEl = el("path", {class: "hull", fill: clusterColor(c.id), stroke: clusterColor(c.id)}, gHulls);
    c.lblEl = el("text", {class: "clabel", fill: clusterColor(c.id)}, gClusterLabels);

      (n.cluster !== null ? `, cluster ${clusters[n.cluster].label}` : ""));

    n.lbl.textContent = n.label;

    n.el.addEventListener("click", ev => { ev.stopPropagation(); select(n); });

    n.el.addEventListener("mouseleave", () => isDoc(n) && !n.keepLabel && n.lbl.classList.remove("show"));

function convexHull(points) {
  const pts = [...points].sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  if (pts.length < 3) return pts;
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lower = [], upper = [];
  for (const p of pts) { while (lower.length >= 2 && cross(lower.at(-2), lower.at(-1), p) <= 0) lower.pop(); lower.push(p); }
  for (const p of pts.reverse()) { while (upper.length >= 2 && cross(upper.at(-2), upper.at(-1), p) <= 0) upper.pop(); upper.push(p); }
  return lower.slice(0, -1).concat(upper.slice(0, -1));
}
function updateHulls(list = clusters) {
  for (const c of list) {
    const shown = c.nodes.filter(n => !n.hidden);
    c.hullEl.style.display = c.lblEl.style.display = shown.length ? "" : "none";
    if (!shown.length) continue;
    const hull = convexHull(shown.map(n => [n.x, n.y]));
    c.hullEl.setAttribute("d", "M" + hull.map(p => p.join(" ")).join(" L") + " Z");
    const top = Math.min(...shown.map(n => n.y - radius(n)));
    c.lblEl.setAttribute("x", shown.reduce((s, n) => s + n.x, 0) / shown.length);
    c.lblEl.setAttribute("y", top - 26);
  }
}
function position(only) {
  const list = only || nodes;
  for (const n of list) {
    const r = radius(n), shape = GROUPS[n.group]?.shape || "circle";
    if (shape === "circle") { n.el.setAttribute("cx", n.x); n.el.setAttribute("cy", n.y); }
    else {
      n.el.setAttribute("x", n.x - r); n.el.setAttribute("y", n.y - r);
      if (shape === "diamond") n.el.setAttribute("transform", `rotate(45 ${n.x} ${n.y})`);
    }
    n.lbl.setAttribute("x", n.x + r + 4); n.lbl.setAttribute("y", n.y + 3.5);
  }
  const es = only ? [...new Set(only.flatMap(n => adj[n.id] || []))] : edges;
  for (const e of es) {
    e.el.setAttribute("x1", e.a.x); e.el.setAttribute("y1", e.a.y);
    e.el.setAttribute("x2", e.b.x); e.el.setAttribute("y2", e.b.y);
  }
  updateHulls(only ? clusters.filter(c => only.some(n => n.cluster === c.id)) : clusters);
}
function recolour() { for (const n of nodes) n.el.setAttribute("fill", color(n)); legend(); }

// ------------------------------------------------------------------ pan / zoom / drag
let view = {x: 0, y: 0, w: 1000, h: 700};
function applyView() {
  svg.setAttribute("viewBox", `${view.x} ${view.y} ${view.w} ${view.h}`);
  // graph units per screen pixel: cluster and hub names keep a readable size when zoomed out
  svg.style.setProperty("--k", Math.max(1, view.w / Math.max(1, svg.getBoundingClientRect().width)));
}
function fit(list = nodes, pad = 60) {
  if (!list.length) return;
  // screen space kept clear: the toolbar above, the legend below
  const TOP = document.querySelector(".tools").offsetHeight + 24, SIDE = 16;
  const BOTTOM = document.getElementById("legend").offsetHeight + 16;
  const xs = list.map(n => n.x), ys = list.map(n => n.y);
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad + 90, minY = Math.min(...ys) - pad - 30,
    maxY = Math.max(...ys) + pad;
  const box = svg.getBoundingClientRect();
  const usableW = Math.max(100, box.width - 2 * SIDE), usableH = Math.max(100, box.height - TOP - BOTTOM);
  const k = Math.max((maxX - minX) / usableW, (maxY - minY) / usableH);      // graph units per pixel
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  view = {x: cx - (SIDE + usableW / 2) * k, y: cy - (TOP + usableH / 2) * k, w: box.width * k, h: box.height * k};
  applyView();
}
function toGraph(ev) {
  const box = svg.getBoundingClientRect();
  return {x: view.x + (ev.clientX - box.left) / box.width * view.w, y: view.y + (ev.clientY - box.top) / box.height * view.h};
}
svg.addEventListener("wheel", ev => {
  ev.preventDefault();
  const p = toGraph(ev), s = Math.exp(ev.deltaY * 0.0012);
  view = {x: p.x - (p.x - view.x) * s, y: p.y - (p.y - view.y) * s, w: view.w * s, h: view.h * s};
  applyView();
}, {passive: false});
let drag = null;
function startDrag(ev, n) { ev.stopPropagation(); drag = {node: n, moved: false}; svg.setPointerCapture(ev.pointerId); }
svg.addEventListener("pointerdown", ev => {
  if (drag) return;
  drag = {pan: true, start: toGraph(ev), view: {...view}};
  svg.classList.add("panning"); svg.setPointerCapture(ev.pointerId);
});
svg.addEventListener("pointermove", ev => {
  if (!drag) return;
  if (drag.node) { const p = toGraph(ev); drag.node.x = p.x; drag.node.y = p.y; drag.moved = true; position([drag.node]); }
  else {
    const box = svg.getBoundingClientRect();
    view.x = drag.view.x - (ev.clientX - box.left - (drag.start.x - drag.view.x) / drag.view.w * box.width) * view.w / box.width;
    view.y = drag.view.y - (ev.clientY - box.top - (drag.start.y - drag.view.y) / drag.view.h * box.height) * view.h / box.height;
    drag.moved = true; applyView();
  }
});
svg.addEventListener("pointerup", () => { svg.classList.remove("panning"); drag = null; });
svg.addEventListener("click", () => { if (!drag) select(null); });

// ------------------------------------------------------------------ details
const details = document.getElementById("details");
let selected = null;
function select(n) {
  if (selected) selected.el.classList.remove("selected");
  selected = n;
  if (!n) { details.innerHTML = '<h2>Details</h2><p class="empty">Click any dot to see what it is and what it connects to.</p>'; return; }
  n.el.classList.add("selected");
  const links = (adj[n.id] || []).map(e => ({e, o: e.a === n ? e.b : e.a}));
  const kind = GROUPS[n.group]?.label || n.group;
  let html = `<h2>${kind}</h2><p class="d-title">${esc(n.title || n.label)}</p>`;
  const meta = [n.date, n.from && "from " + n.from, n.ref && isDoc(n) && n.ref, n.chunks && `${n.chunks} chunk${n.chunks > 1 ? "s" : ""}`].filter(Boolean);
  if (meta.length) html += `<div class="d-meta">${esc(meta.join(" · "))}</div>`;
  if (n.cluster !== null) {
    const c = clusters[n.cluster];
    html += `<p class="kv"><span>cluster:</span> <span class="sw" style="background:${clusterColor(c.id)}"></span> <a href="#" data-cluster="${c.id}">${esc(c.label)}</a></p>`;
  } else if (n.unlinked) html += `<p class="kv"><span>cluster:</span> none - not linked to anything known</p>`;
  html += `<p class="kv"><span>links:</span> ${n.degree}${n.hub ? ` · hub #${n.hub}` : ""}</p>`;
  if (n.info) for (const [k, v] of Object.entries(n.info)) html += `<p class="kv"><span>${esc(k.replace("_", " "))}:</span> ${esc(k === "value_inr" ? "₹" + fmt(v) : v)}</p>`;
  if (n.snippet) html += `<div class="d-snip">${esc(n.snippet)}${n.snippet.length >= 280 ? "…" : ""}</div>`;
  html += `<h2 style="margin-top:14px">Connected to (${links.length})</h2><ul class="d-links">`;
  for (const {e, o} of links.sort((x, y) => (x.o.group > y.o.group ? 1 : -1)))
    html += `<li data-id="${o.id}"><span class="sw ${GROUPS[o.group]?.shape === "square" ? "sq" : ""}" style="background:${color(o)}"></span> ${esc(o.title || o.label)} <span class="why">· ${esc(e.label || e.kind.replace("_", " "))}</span></li>`;
  html += "</ul>";
  details.innerHTML = html;
  details.querySelectorAll("li[data-id]").forEach(li => li.addEventListener("click", () => select(byId[li.dataset.id])));
  details.querySelector("[data-cluster]")?.addEventListener("click", ev => {
    ev.preventDefault(); showTab("clusters"); focusCluster(clusters[+ev.target.dataset.cluster], true);
  });
}
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }

// ------------------------------------------------------------------ cluster focus
let focused = null;
function focusCluster(c, keep = false) {
  clearTrace();
  if (focused === c && !keep) c = null;
  focused = c;
  svg.classList.toggle("focusing", !!c);
  for (const n of nodes) {
    const on = !!c && n.cluster === c.id;
    n.el.classList.toggle("infocus", on); n.lbl.classList.toggle("infocus", on);
  }
  for (const e of edges) e.el.classList.toggle("infocus", !!c && e.a.cluster === c.id && e.b.cluster === c.id);
  for (const k of clusters) {
    k.hullEl.classList.toggle("infocus", k === c); k.lblEl.classList.toggle("infocus", k === c);
  }
  document.querySelectorAll(".cl").forEach(b => b.setAttribute("aria-pressed", String(!!c && +b.dataset.id === c.id)));
  fit(c ? c.nodes : nodes.filter(n => !n.hidden), c ? 90 : 60);
}

// ------------------------------------------------------------------ traces
const traceBox = document.getElementById("trace");
let timers = [];
function clearTrace() {
  timers.forEach(clearTimeout); timers = [];
  svg.classList.remove("tracing");
  for (const n of nodes) { n.el.classList.remove("ask", "scope", "hit", "factn"); n.lbl.classList.remove("ask", "scope", "hit", "factn", "show"); n.keepLabel = false; }
  for (const e of edges) e.el.classList.remove("lit");
  gBadges.replaceChildren();
  document.querySelectorAll(".q").forEach(b => b.setAttribute("aria-pressed", "false"));
  traceBox.innerHTML = "";
}
function mark(ids, cls) {
  for (const id of ids) {
    const n = byId[id]; if (!n) continue;
    n.el.classList.add(cls); n.lbl.classList.add(cls);
    if (cls === "hit" || cls === "ask") { n.keepLabel = true; n.lbl.classList.add("show"); }
  }
}
function play(t, button) {
  if (focused) focusCluster(focused);
  clearTrace();
  button.setAttribute("aria-pressed", "true");
  const b = t.brain, st = b.stats;
  const hits = [...new Set(b.returned.map(r => r.document_id))];
  const factNodes = b.facts.map(f => f.split(":")).filter(([tbl]) => tbl === "decisions" || tbl === "promises").map(([, id]) => id);
  const scopeEnts = b.scope_entities || [];
  const touched = [...new Set([...b.entities, ...hits].map(id => byId[id]?.cluster).filter(c => c !== null && c !== undefined))];
  traceBox.innerHTML = `
    <div class="asked"><span class="why">Question</span><br><b>${esc(t.query)}</b></div>
    <ol class="steps">
      <li id="s1"><span class="n">1</span><div><b>Who is it about?</b><br><span class="why">${b.entities.length ? b.entities.map(id => esc(byId[id]?.label)).join(", ") : "No known names - search the whole brain"}</span></div></li>
      <li id="s2"><span class="n">2</span><div><b>Narrow the search</b><br><span class="big">${st.scope_documents}</span> of ${st.corpus_documents} documents
        <div class="bar"><i style="width:0" id="barScope"></i></div><span class="why">${st.scope_chunks} of ${st.corpus_chunks} chunks searched (${pct(st.share_searched)})</span></div></li>
      <li id="s3"><span class="n">3</span><div><b>Pick the best pieces</b><br><span class="big">${st.returned_chunks}</span> chunks · <span class="big">${fmt(st.returned_tokens)}</span> tokens
        <span class="why">(${pct(st.share_returned)} of the brain) in ${Math.round(st.total_ms)} ms</span>
        ${touched.length ? `<br><span class="why">from ${touched.length} cluster${touched.length > 1 ? "s" : ""}: ${touched.map(c => esc(clusters[c].label)).join(", ")}</span>` : ""}
        <ul class="ret">${b.returned.map((r, i) => `<li data-id="${r.document_id}"><b>${i + 1}</b>${esc(byId[r.document_id]?.title || "")}<br><span class="why">${esc(r.why.join(" · "))}</span></li>`).join("")}</ul></div></li>
      <li id="s4"><span class="n">4</span><div><b>Add known facts</b>${b.fact_text.length ? b.fact_text.map(f => `<div class="fact">${esc(f)}</div>`).join("") : '<br><span class="why">none needed</span>'}</div></li>
    </ol>
    <div class="cmp">${compare(t)}</div>
    <h2 style="margin-top:18px">Other questions</h2>`;
  document.querySelector("aside.left").scrollTop = 0;
  traceBox.querySelectorAll(".ret li").forEach(li => li.addEventListener("click", () => select(byId[li.dataset.id])));
  svg.classList.add("tracing");
  const step = (ms, fn) => timers.push(setTimeout(fn, ms));
  step(0, () => { document.getElementById("s1").classList.add("on"); mark(b.entities, "ask"); });
  step(700, () => {
    document.getElementById("s2").classList.add("on");
    mark(scopeEnts.filter(id => !b.entities.includes(id)), "scope");
    mark(st.scoped ? b.scope_docs : nodes.filter(isDoc).map(n => n.id), "scope");
    document.getElementById("barScope").style.width = pct(st.share_searched);
  });
  step(1500, () => {
    document.getElementById("s3").classList.add("on");
    mark(hits, "hit");
    const lit = new Set([...b.entities, ...hits]);
    for (const e of edges) if (lit.has(e.s) && lit.has(e.t)) e.el.classList.add("lit");
    hits.forEach((id, i) => {
      const n = byId[id]; if (!n) return;
      el("circle", {class: "badge-bg", cx: n.x - radius(n) - 6, cy: n.y - radius(n) - 6, r: 7}, gBadges);
      const tx = el("text", {class: "badge", x: n.x - radius(n) - 6, y: n.y - radius(n) - 2.5, "text-anchor": "middle"}, gBadges);
      tx.textContent = i + 1;
    });
  });
  step(1500, () => fit([...b.entities, ...hits, ...factNodes].map(id => byId[id]).filter(Boolean), 170));
  step(2300, () => { document.getElementById("s4").classList.add("on"); mark(factNodes, "factn"); });
}
function compare(t) {
  const b = t.brain.stats, rag = t.vector_all?.stats;
  let html = `<h2 style="margin-top:16px">Compared with</h2>`;
  html += `<div>Scoped brain: searched ${pct(b.share_searched)} · sent ${fmt(b.returned_tokens)} tokens<div class="bar"><i style="width:${pct(b.share_searched)}"></i></div></div>`;
  if (rag) html += `<div>Classic RAG (search everything): searched 100% · sent ${fmt(rag.returned_tokens)} tokens, no facts<div class="bar rag"><i style="width:100%"></i></div></div>`;
  html += `<div>No retrieval (send the whole brain): ${fmt(b.corpus_tokens)} tokens every question<div class="bar rag"><i style="width:100%"></i></div></div>`;
  return html;
}

const hiddenGroups = new Set();

  updateHulls();
}
function queries() {
  const box = document.getElementById("queries");
  if (!DATA.traces.length) { box.innerHTML = '<p class="empty">No questions yet - run <code>omnitrix brain bench</code> or <code>omnitrix brain ask</code>, then reload.</p>'; return; }
  for (const t of DATA.traces) {
    const b = document.createElement("button");
    b.className = "q"; b.type = "button"; b.setAttribute("aria-pressed", "false");
    b.innerHTML = `${esc(t.query)}<br><span class="agent">asked by ${esc(t.agent.replace("_", " "))} · searched ${pct(t.brain.stats.share_searched)}</span>`;
    b.addEventListener("click", () => play(t, b));
    box.append(b);
  }
}
document.getElementById("tab-clusters").addEventListener("click", () => showTab("clusters"));
document.getElementById("tab-questions").addEventListener("click", () => showTab("questions"));
const modeBtn = document.getElementById("mode");
if (!GFY.available) modeBtn.hidden = true;
modeBtn.addEventListener("click", () => {
  colourBy = colourBy === "cluster" ? "type" : "cluster";
  modeBtn.textContent = colourBy === "cluster" ? "Colour: clusters" : "Colour: types";
  recolour();
});
document.getElementById("fit").addEventListener("click", () => fit(nodes.filter(n => !n.hidden)));
document.getElementById("clear").addEventListener("click", () => { clearTrace(); if (focused) focusCluster(focused); select(null); });
document.getElementById("labels").addEventListener("click", ev => {
  const on = svg.classList.toggle("showdocs");
  ev.target.textContent = on ? "Hide document names" : "Show document names";
});
document.getElementById("find").addEventListener("input", ev => {
  const q = ev.target.value.trim().toLowerCase();
  if (q.length < 2) return;
  const n = nodes.find(n => (n.title || n.label).toLowerCase().includes(q) || (n.ref || "").toLowerCase().includes(q));
  if (n) { select(n); view = {...view, x: n.x - view.w / 2, y: n.y - view.h / 2}; applyView(); }
});
window.addEventListener("resize", () => fit(focused ? focused.nodes : nodes.filter(n => !n.hidden), focused ? 90 : 60));

layout(); draw(); chips(); legend(); clusterPanel(); queries(); fit();
if (!GFY.available) showTab("questions");
</script>
</body>
</html>
